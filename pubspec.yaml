name: validart
description: A type-safe validation library for Dart, inspired by Zod. Supports parse/safeParse, transforms, coercion, schema composition, and structured errors.
version: 2.2.0
homepage: https://github.com/edunatalec/validart
repository: https://github.com/edunatalec/validart
issue_tracker: https://github.com/edunatalec/validart/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0

topics:
  - validation
  - schema
  - parsing
  - forms
  - i18n
