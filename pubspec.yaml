name: validart
description: Type-safe validation for Dart, inspired by Zod. Validate typed entities and raw JSON-like maps with the same schema — structured errors, async, i18n built-in.
version: 3.0.1
repository: https://github.com/edunatalec/validart

environment:
  sdk: '^3.0.0'

dependencies:

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: '>=1.24.4 <2.0.0'

topics:
  - validation
  - schema
  - parsing
  - forms
  - i18n
